x-ros-environment: &ros-environment
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
  RMW_IMPLEMENTATION: rmw_${RMW:-cyclonedds}_cpp

x-build-args: &build-args
  ROS_DISTRO: ${CONTAINER_ROS_DISTRO:-jazzy}
  ROS_IMAGE: ${ROS_IMAGE:-ros:${CONTAINER_ROS_DISTRO:-jazzy}-ros-base-noble}
  RMW: ${RMW:-cyclonedds}
  OCI_SOURCE: ${OCI_SOURCE:-}
  OCI_REVISION: ${OCI_REVISION:-unknown}

x-geometry-config: &geometry-config
  type: bind
  source: ../../curtmini_piper_description/config
  target: /opt/ws/install/share/curtmini_piper_description/config
  read_only: true
  bind:
    create_host_path: false

x-moveit-rviz: &moveit-rviz
  image: ${IMAGE_PREFIX:-curtmini-piper}-moveit-rviz:${CONTAINER_ROS_DISTRO:-jazzy}-${RMW:-cyclonedds}
  build:
    context: ${CURTMINI_PIPER_IMAGE_SOURCE:-https://github.com/ipa-may/curtmini_piper.git#main}
    additional_contexts:
      ros_base: service:piper-ros-base
      robot_description: service:piper-description
    dockerfile: curtmini_piper_moveit_config/docker/Dockerfile
    target: moveit-rviz
    args:
      <<: *build-args
  network_mode: host
  init: true
  environment:
    <<: *ros-environment
  volumes:
    - *geometry-config

services:
  piper-moveit-config:
    # Available to every build graph, with no runtime containers.
    scale: 0
    image: ${IMAGE_PREFIX:-curtmini-piper}-moveit-config:${CONTAINER_ROS_DISTRO:-jazzy}-${RMW:-cyclonedds}
    build:
      context: ${CURTMINI_PIPER_IMAGE_SOURCE:-https://github.com/ipa-may/curtmini_piper.git#main}
      dockerfile: curtmini_piper_moveit_config/docker/Dockerfile
      target: config
      additional_contexts:
        ros_base: service:piper-ros-base
        robot_description: service:piper-description
      args:
        <<: *build-args
    command: ["true"]

  moveit-rviz-sim:
    <<: *moveit-rviz
    profiles: [simulation]
    command:
      - /opt/container/wait_for_ros.sh
      - action
      - /move_action
      - "120"
      - --
      - ros2
      - launch
      - curtmini_piper_moveit_config
      - moveit_rviz.launch.py
      - use_sim_time:=true
      - use_hokuyo:=${SIM_USE_HOKUYO:-true}
      - arm_model:=${ARM_MODEL:-piper_x}

  moveit-rviz-hardware:
    <<: *moveit-rviz
    profiles: [hardware]
    command:
      - /opt/container/wait_for_ros.sh
      - action
      - /move_action
      - "120"
      - --
      - ros2
      - launch
      - curtmini_piper_moveit_config
      - moveit_rviz.launch.py
      - use_sim_time:=false
      - arm_model:=${ARM_MODEL:-piper}
